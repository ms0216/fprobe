# PYNQ-Z2 (Zynq-7020) through its own USB-JTAG (TUL FT2232, WinUSB on Interface 0): the two Cortex-A9 cores, NOT smp-grouped
# (each core is halted / resumed on its own, as on the Pi), gdb port off, Tcl RPC on 6667 (6666 is the Pi OpenOCD of the prototype). Taps / dbgbase from OpenOCD's
# target/zynq_7000.cfg (0x80090000 / 0x80092000). Nothing here programs the PL.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi serial "1234-tul"
ftdi channel 0
ftdi layout_init 0x0088 0x008b
transport select jtag
adapter speed 1000
reset_config none
jtag newtap zynq_pl bs -irlen 6 -ignore-version -ircapture 0x1 -irmask 0x03 -expected-id 0x03727093
jtag newtap zynq cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x4ba00477
dap create zynq.dap -chain-position zynq.cpu
target create zynq.cpu0 cortex_a -dap zynq.dap -coreid 0 -dbgbase 0x80090000
target create zynq.cpu1 cortex_a -dap zynq.dap -coreid 1 -dbgbase 0x80092000
gdb port disabled
telnet port disabled
tcl port 6667
target create zynq.ahb mem_ap -dap zynq.dap -ap-num 0
