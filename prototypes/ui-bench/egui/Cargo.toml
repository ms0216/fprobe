[package]
name = "uibench-egui"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
serde_json = "1.0.154"
web-time = "1.1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Response", "RequestInit", "HtmlCanvasElement"] }

[profile.release]
opt-level = 3
