# SPI（FPGA の回路の送り込みと演算器のレジスタ）・GPIO（CS・FPGA の電源と有効・マーカー）
CONFIG_SPI=y
CONFIG_GPIO=y

# ログは RTT（fprobe が SWD で読む）。UART0 は GPIO0・1 が SPI と CS なので使わない
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=y

# fprobe の RTOS の表示（host/fprobe/rtos/zephyr.py）
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_DEBUG_THREAD_INFO=y

# ソース行・変数で追いやすく
CONFIG_DEBUG_OPTIMIZATIONS=y
